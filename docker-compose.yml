# Single-instance topology only. `src/lib/rate-limit.ts` keeps every
# rate-limit bucket (including the public API's per-key budget) in this
# process's memory — running more than one `app` replica (or moving to
# a platform that fans requests out across instances) silently splits
# each budget across replicas instead of enforcing it, with no error or
# log. If you ever need horizontal scale, swap `checkRateLimit` for a
# shared store first (see that file's header comment).
name: wacrm

services:
  app:
    build:
      context: .
      # NEXT_PUBLIC_* vars are inlined at build time — forward them
      # from .env.local as build args. Changing any of them requires
      # a rebuild (docker compose up --build).
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE:-en}
    # Runtime (server-only) secrets come from .env.local; they are
    # never baked into the image.
    env_file:
      - .env.local
    # The server always listens on 3000 inside the container. Pinned
    # here because `environment` wins over `env_file`, so a stray PORT
    # in .env.local can't desync the app from the mapping and the
    # healthcheck below.
    environment:
      PORT: 3000
    # Bound to loopback only — the app is reached through a reverse proxy
    # (nginx/OpenLiteSpeed/etc.) terminating TLS on the real domain, not
    # directly from the internet. Docker's own iptables rules for
    # published ports bypass host firewalls (a well-known gotcha), so
    # binding 0.0.0.0 here would expose plain-HTTP access on the host's
    # public IP regardless of firewalld/ufw rules. HOST_PORT=8080 still
    # works, just stays localhost-only.
    ports:
      - '127.0.0.1:${HOST_PORT:-3000}:3000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then((r)=>process.exit(r.ok||r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
